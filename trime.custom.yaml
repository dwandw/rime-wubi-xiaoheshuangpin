  "preset_keyboards/qwerty/ascii_mode": 0
  "preset_keyboards/editor":
    ascii_mode: 1
    author: flypy.com
    name: "编辑键盘"
    width: 20.25
    height: 39.5
    keys:
      - {click: select_all}
      - {click: Left1}
      - {click: Up}
      - {click: Right1}
      - {click: space1, key_back_color: gnb, key_text_color: gnt, width: 19}
      - {click: cut}
      - {click: Left}
      - {click: Shift_L2}
      - {click: Right}
      - {click: Keyboard_number, key_back_color: gnb, key_text_color: gnt, width: 19}
      - {click: copy}
      - {click: Home}
      - {click: Down}
      - {click: End}
      - {click: BackSpace, key_back_color: gnb, key_text_color: gnt, width: 19}
      - {click: paste}
      - {click: undo}
      - {click: Keyboard_default}
      - {click: redo}
      - {click: Return, key_back_color: gnb, key_text_color: gnt, width: 19}
  "preset_keys/Keyboard_editor": { label: 123, functional: false, send: Eisu_toggle, select: editor }
  "preset_keys/Shift_L2": {label: 选择, preview: '⇪', functional: false, send: Shift_L}
  "preset_keys/Left1": {label: '⇦', send: Control+Left, repeatable: true, functional: false}
  "preset_keys/Right1": {label: '⇨', send: Control+Right, repeatable: true, functional: false}
  "preset_keys/space1": {repeatable: false, label: '空格', functional: false, send: space}
  "preset_keys/menu_keyboard": { label: 菜单, send: function, command: menu_keyboard }

