  # "style/latin_font": "MonaspaceKrypton-Light.otf"             #西文字型
  "style/latin_font": "Alegreya-VariableFont_wght.ttf"         #西文字型
  "style/text_font": "YaHei.Consolas.1.12.ttf"                 #編碼字型
  "style/label_font": "MonaspaceKrypton-Light.otf"             #編標籤字型
  "style/candidate_font": "LXGWWenKai-Regular.ttf"             #候選字型
