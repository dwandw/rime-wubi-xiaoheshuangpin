   - "PlangothicP1-Regular.otf"
   - "PlangothicP2-Regular.otf"
  "style/locale": "zh_CN"
  # "style/comment_on_top": false
  "style/speech_opencc_config": t2s.json #語音輸入簡繁轉換
  preset_keys/+:
    Tab: {label: ⇥, send: Tab}
  "preset_keys/BackSpace/label": 🔙🔙 #空格
